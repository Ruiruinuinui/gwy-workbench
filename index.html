<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考公工作台 · 小布伴学</title>
<script>document.write('<script src="hot_topics.js?v='+new Date().toISOString().slice(0,10)+'"><\/script>');</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f1f5f9;--card:#fff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --border:#e2e8f0;--pri:#3b82f6;--pri2:#eff6ff;--pri3:#2563eb;
  --ok:#10b981;--ok2:#ecfdf5;--warn:#f59e0b;--danger:#ef4444;
  --shadow:0 1px 3px rgba(0,0,0,.06);--radius:10px;--r2:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
#app{max-width:900px;margin:0 auto;padding:16px 20px 60px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card-hdr{font-size:15px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.card-hdr .arrow{font-size:10px;color:var(--text3);transition:.2s;margin-left:auto}
.card-hdr.collapsed .arrow{transform:rotate(-90deg)}
.card-body{overflow:hidden;transition:max-height .3s ease}
.card-body.hidden{max-height:0}
.cdown-card{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px;cursor:pointer;position:relative}
.cdown-card .days{font-size:44px;font-weight:800;line-height:1}
.cdown-card .label{font-size:12px;opacity:.85;margin-top:2px}
.cdown-card .exam{font-size:14px;margin-top:2px;font-weight:600}
.cdown-card .edit-hint{position:absolute;top:12px;right:14px;font-size:11px;opacity:.6}
.cdown-edit{background:var(--card);border:2px solid var(--pri);border-radius:var(--radius);padding:14px;margin-bottom:14px;display:none}
.cdown-edit.show{display:block}
.cdown-edit .edit-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cdown-edit .edit-row label{font-size:13px;font-weight:600;color:var(--text);min-width:60px}
.cdown-edit .edit-row input{padding:8px 12px;border:1px solid var(--border);border-radius:var(--r2);font-size:13px;outline:none;flex:1;background:var(--bg)}
.cdown-edit .edit-row input:focus{border-color:var(--pri)}
.cdown-edit .edit-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.cdown-edit .edit-actions button{padding:8px 18px;border-radius:var(--r2);cursor:pointer;font-size:13px;font-weight:600;border:none}
.cdown-edit .btn-save{background:var(--pri);color:#fff}
.cdown-edit .btn-save:hover{background:var(--pri3)}
.cdown-edit .btn-cancel{background:var(--border);color:var(--text2)}
.stats-row{display:flex;gap:12px;margin-bottom:14px}
.stat-card{flex:1;min-width:100px;background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);text-align:center}
.stat-card .val{font-size:26px;font-weight:800;color:var(--pri)}
.stat-card .val.green{color:var(--ok)}
.stat-card .lbl{font-size:12px;color:var(--text3);margin-top:2px}

/* Todo */
.todo-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r2);font-size:13px;transition:.15s}
.todo-row:hover{background:var(--bg)}
.todo-row.timing{background:var(--pri2)}
.todo-row.done .todo-check{border-color:var(--ok);background:var(--ok);color:#fff}
.todo-row.done .todo-text{text-decoration:line-through;color:var(--text3)}
.todo-check{width:18px;height:18px;border:2px solid var(--border);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;cursor:pointer;transition:.15s}
.todo-text{flex:1;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-mod{font-size:10px;color:var(--text3);background:var(--border);border-radius:8px;padding:1px 6px;flex-shrink:0}
.todo-dur{font-size:12px;color:var(--pri);font-weight:600;min-width:42px;text-align:right;flex-shrink:0}
.todo-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;color:var(--text3);transition:.15s}
.todo-btn:hover{border-color:var(--pri);color:var(--pri);background:var(--pri2)}
.todo-btn.timing{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.todo-del{font-size:12px;color:var(--text3);cursor:pointer;padding:2px;border:none;background:none;flex-shrink:0}
.todo-del:hover{color:var(--danger)}
.todo-add-row{display:flex;gap:6px;padding:6px 10px;flex-wrap:wrap}
.todo-add-row input{flex:1;min-width:100px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r2);font-size:12px;outline:none;background:var(--card)}
.todo-add-row input:focus{border-color:var(--pri)}
.todo-add-row select{padding:7px 6px;border:1px solid var(--border);border-radius:var(--r2);font-size:12px;outline:none;background:var(--card);color:var(--text2)}
.todo-add-row button{padding:7px 14px;border:none;border-radius:var(--r2);background:var(--pri);color:#fff;font-size:12px;cursor:pointer;font-weight:600}

/* Module list */
.mod-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r2);cursor:pointer;font-size:13px;color:var(--text2);transition:.15s;margin-bottom:2px}
.mod-row:hover{background:var(--bg);color:var(--text)}
.mod-row.active{background:var(--pri2);color:var(--pri);font-weight:600}
.mod-row .mod-icon{font-size:16px}
.mod-row .mod-time{margin-left:auto;font-size:11px;color:var(--pri);background:var(--pri2);border-radius:10px;padding:2px 8px}
.mod-row .rest-tag{font-size:10px;background:var(--ok2);color:var(--ok);border-radius:10px;padding:1px 7px}

/* Review */
.review-stars{display:flex;gap:2px;cursor:pointer;margin-bottom:8px}
.review-star{font-size:24px;color:var(--border);transition:.15s}
.review-star.on{color:var(--warn)}
.review-field{margin-bottom:8px}
.review-field label{display:block;font-size:12px;color:var(--text2);margin-bottom:3px;font-weight:600}
.review-field textarea{width:100%;min-height:60px;padding:10px;border:1px solid var(--border);border-radius:var(--r2);font-size:13px;resize:vertical;outline:none;font-family:inherit}
.review-field textarea:focus{border-color:var(--pri)}
.btn{padding:8px 18px;border:none;border-radius:var(--r2);cursor:pointer;font-size:13px;font-weight:600}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:hover{background:var(--pri3)}

/* Plan cards */
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.plan-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border-left:4px solid var(--border);transition:.2s}
.plan-card.active-phase{border-left-width:5px;box-shadow:0 4px 16px rgba(59,130,246,.15);transform:scale(1.02)}
.plan-card .p-title{font-size:14px;font-weight:700;color:var(--text)}
.plan-card .p-time{font-size:11px;color:var(--pri);margin:4px 0}
.plan-card .p-desc{font-size:12px;color:var(--text2);line-height:1.6}
.plan-card .p-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-top:6px;background:var(--pri);color:#fff}
.plan-card .p-tip{font-size:11px;color:var(--pri);margin-top:8px;font-weight:600}

/* Job */
.job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.job-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.job-card .j-title{font-size:13px;font-weight:700;color:var(--text)}
.job-card .j-info{font-size:11px;color:var(--text2);margin-top:4px}
.job-card .j-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.job-card .j-tag{font-size:10px;background:var(--border);border-radius:10px;padding:2px 8px;color:var(--text2)}
.job-form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.job-form select,.job-form input{padding:7px 10px;border:1px solid var(--border);border-radius:var(--r2);font-size:12px;outline:none}
.job-form select:focus,.job-form input:focus{border-color:var(--pri)}
.job-form button{padding:7px 14px;background:var(--pri);color:#fff;border:none;border-radius:var(--r2);cursor:pointer;font-size:12px;font-weight:600}

/* Interview hot topics - expandable */
.interview-grid{display:flex;flex-direction:column;gap:10px}
.hot-card{cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);transition:.2s}
.hot-card:hover{border-color:var(--pri)}
.hot-card .hot-meta{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.hot-card .hot-cat{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;color:#fff}
.hot-card .hot-src{font-size:10px;color:var(--text3)}
.hot-card .hot-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.hot-card .hot-summary{font-size:12px;color:var(--text2);line-height:1.6}
.hot-card .hot-expand{font-size:11px;color:var(--pri);font-weight:600;margin-top:8px;display:flex;align-items:center;gap:4px}
.hot-card .hot-expand .chevron{transition:.2s;display:inline-block}
.hot-card.expanded .hot-expand .chevron{transform:rotate(180deg)}
.hot-card .hot-full{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.hot-card.expanded .hot-full{display:block}
.hot-card .hot-article{font-size:13px;color:var(--text);line-height:1.85;margin-bottom:12px;text-indent:2em}
.hot-card .hot-commentary{font-size:13px;color:var(--pri);line-height:1.85;background:var(--pri2);padding:12px;border-radius:var(--r2);border-left:3px solid var(--pri)}
.hot-card .hot-commentary-tag{font-size:11px;font-weight:700;color:var(--pri);margin-bottom:6px}
.hot-card .hot-commentary-body{font-size:13px;color:var(--text);line-height:1.85;text-indent:2em;margin-bottom:6px}
.hot-card .hot-commentary-body:last-child{margin-bottom:0}
.hot-card .hot-commentary-label{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);background:var(--card);padding:1px 6px;border-radius:4px;margin-right:4px}
.hot-card .hot-commentary-keywords{font-size:12px;color:var(--pri);font-weight:600;margin-top:4px;padding-top:6px;border-top:1px dashed var(--border)}
.hot-card .hot-commentary-quote{font-style:italic;color:var(--text2);background:#fff;padding:8px 10px;border-radius:var(--r2);margin-top:6px;border-left:2px solid var(--warn)}

/* Exercise / Diet */
.record-item{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;color:var(--text2);border-radius:var(--r2)}
.record-item:hover{background:var(--bg)}
.record-adder{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;padding:0 12px}
.record-adder input,.record-adder select{padding:7px 10px;border:1px solid var(--border);border-radius:var(--r2);font-size:12px;outline:none}
.record-adder button{padding:7px 14px;background:var(--pri);color:#fff;border:none;border-radius:var(--r2);cursor:pointer;font-size:12px;font-weight:600}
.btn-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0 4px}
.btn-del:hover{color:var(--danger)}

/* Week summary table */
.wk-table{width:100%;border-collapse:collapse;font-size:13px}
.wk-table th{background:var(--bg);padding:10px 12px;text-align:left;color:var(--text2);font-weight:600;border-bottom:2px solid var(--border)}
.wk-table td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text)}
.wk-table .wk-day{font-weight:600;white-space:nowrap}
.wk-table .wk-cell{font-size:12px;color:var(--text2)}

/* Pie chart */
.pie-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.pie-legend{display:flex;flex-direction:column;gap:6px}
.pie-lg-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.pie-lg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Diet kcal highlight */
.kcal-badge{font-size:13px;font-weight:700;color:var(--warn);margin-left:auto}
.kcal-total{font-size:11px;color:var(--warn);font-weight:600;margin-left:6px}

/* Timer */
#timer-bar{position:fixed;bottom:0;left:0;right:0;height:44px;background:var(--card);border-top:1px solid var(--border);display:none;align-items:center;justify-content:center;gap:16px;padding:0 20px;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.05)}
#timer-bar.show{display:flex}
#timer-bar .t-display{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
#timer-bar .t-name{font-size:13px;color:var(--text2)}
#timer-bar .t-pause,#timer-bar .t-complete{padding:6px 14px;border-radius:var(--r2);border:none;cursor:pointer;font-size:12px;font-weight:600}
#timer-bar .t-pause{background:var(--warn);color:#fff}
#timer-bar .t-complete{background:var(--ok);color:#fff}

.empty{text-align:center;padding:30px;color:var(--text3);font-size:13px}

.mod-todo-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mod-todo-header .back{font-size:12px;color:var(--pri);cursor:pointer;font-weight:600}
.mod-todo-header .back:hover{text-decoration:underline}

@media (max-width:640px){
  #app{padding:8px 10px 70px}
  .stats-row{flex-direction:row;gap:6px}
  .stat-card{padding:10px 6px}
  .stat-card .val{font-size:22px}
  .stat-card .lbl{font-size:10px}
  .plan-grid,.job-grid{grid-template-columns:1fr}
  .pie-wrap{flex-direction:column;align-items:flex-start}
  .card{padding:12px;margin-bottom:10px}
  .card-hdr{font-size:14px}
  .cdown-card{padding:14px}
  .cdown-card .days{font-size:36px}
  .record-adder{flex-direction:column;gap:4px}
  .record-adder input,.record-adder select{width:100%}
  .todo-row{padding:6px 8px;font-size:12px}
  .todo-add-row input{min-width:80px}
  .mod-row{padding:8px 10px;font-size:12px}
  #timer-bar{height:50px;padding:0 12px;gap:8px}
  #timer-bar .t-display{font-size:18px}
  #timer-bar .t-name{font-size:12px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #timer-bar .t-pause,#timer-bar .t-complete{padding:6px 10px;font-size:11px}
  .hot-card .hot-title{font-size:13px}
  .cdown-edit .edit-row{flex-direction:column;align-items:flex-start;gap:4px}
  .cdown-edit .edit-row label{min-width:auto}
  .wk-table{font-size:11px}
  .wk-table th,.wk-table td{padding:6px 8px}
  .sync-bottom{font-size:11px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer-bar">
  <span class="t-name" id="t-name">--</span>
  <span class="t-display" id="t-display">00:00:00</span>
  <button class="t-pause" onclick="stopTimer()">&#x23F8; 暂停</button>
  <button class="t-complete" onclick="completeActiveTimer()">&#x2713; 完成</button>
</div>

<script>
// ===== DATA =====
var STORAGE_KEY = 'wb_desk_v9';
var MODULES = [
  { id:'speech', name:'言语理解', icon:'\uD83D\uDDE3\uFE0F', color:'#3b82f6' },
  { id:'judgment', name:'判断推理', icon:'\uD83E\uDDE0', color:'#8b5cf6' },
  { id:'common', name:'常识判断', icon:'\uD83D\uDCD6', color:'#f59e0b' },
  { id:'data', name:'资料分析', icon:'\uD83D\uDCCA', color:'#10b981' },
  { id:'quantity', name:'数量关系', icon:'\uD83D\uDD22', color:'#ef4444' },
  { id:'essay', name:'申论', icon:'\u270D\uFE0F', color:'#ec4899' },
  { id:'zongying', name:'综应A类', icon:'\uD83D\uDCDD', color:'#06b6d4' },
  { id:'teaching', name:'数学备课', icon:'\uD83D\uDCD0', color:'#84cc16' },
];

var sampleJobs = [
  {t:'国家税务局',info:'行政执法类',tags:['本科及以上','应届不限','专业宽泛']},
  {t:'海关总署',info:'综合管理类',tags:['本科及以上','应届可报','需体检']},
  {t:'统计局调查队',info:'专业技术类',tags:['本科及以上','应届可报','统计学/经济学']},
  {t:'铁路公安局',info:'行政执法类',tags:['专科及以上','公安学类','体能测试']},
  {t:'海事局',info:'行政执法类',tags:['本科及以上','航海/海事','需出海']},
  {t:'省级发改委',info:'综合管理类',tags:['本科及以上','2年经验','经济/管理类']},
  {t:'街道办事处',info:'基层管理类',tags:['专科及以上','不限经验','不限专业']},
  {t:'市场监管局',info:'行政执法类',tags:['本科及以上','法学/食药相关']},
  {t:'气象局',info:'专业技术类',tags:['本科及以上','大气科学','科研辅助']},
  {t:'外事办',info:'综合管理类',tags:['本科及以上','外语类','翻译能力']},
];

// ===== STATE =====
var defaultState = function(){
  return {
    countdown: { name:'国考', date:'2026-11-29' },
    todos: {}, review: {}, exercise: {}, diet: {},
    interview: { notes:'' },
    activeTimer: null, streak: 0, teachingActive: false,
    weeklyReviewNote: '', dietViewDate: '',
  };
};
var state = defaultState();
var timerInterval = null;

// ===== PERSIST =====
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ var saved = JSON.parse(raw); state = Object.assign(defaultState(), saved); }
    state.todos=state.todos||{}; state.review=state.review||{};
    state.exercise=state.exercise||{}; state.diet=state.diet||{};
    state.interview=state.interview||{notes:''};
    state.activeTimer=null; state.weeklyReviewNote=state.weeklyReviewNote||'';
    state.dietViewDate=state.dietViewDate||'';
  }catch(e){ state = defaultState(); }
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

// ===== HELPERS =====
function T(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function genId(){ return 't'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }
function taskMs(task){ if(!task||!task.sessions) return 0; return task.sessions.reduce(function(s,se){return s+(se.end-se.start);},0); }
function fmtDur(ms){ if(!ms) return '0m'; var m=Math.floor(ms/60000); return m>=60?Math.floor(m/60)+'h'+(m%60)+'m':m+'m'; }
function fmtShort(ms){ if(!ms) return ''; var m=Math.floor(ms/60000); return m>=60?Math.floor(m/60)+'h'+(m%60)+'m':m+'m'; }
function fmtHH(s){ return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function daysLeft(dateStr){ return dateStr?Math.max(0,Math.ceil((Date.parse(dateStr)-Date.now())/86400000)):0; }
function greet(){ var h=new Date().getHours(); return h<6?'夜深了':h<12?'上午好':h<14?'中午好':h<18?'下午好':h<21?'晚上好':'夜深了'; }
function dayLabel(off){ var d=new Date();d.setDate(d.getDate()-off); return (d.getMonth()+1)+'/'+d.getDate(); }

function todayStudyMs(){
  var t=T(), total=0;
  (state.todos[t]||[]).forEach(function(td){ total+=taskMs(td); });
  return total;
}
function moduleTimeToday(modId){
  var t=T(), total=0;
  (state.todos[t]||[]).forEach(function(td){ if(td.moduleId===modId) total+=taskMs(td); });
  return total;
}
function moduleTimeRange(modId, daysBack){
  var total=0;
  for(var i=0;i<daysBack;i++){ var d=new Date();d.setDate(d.getDate()-i); var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); (state.todos[k]||[]).forEach(function(td){ if(td.moduleId===modId) total+=taskMs(td); }); }
  return total;
}

// ===== RENDER ALL =====
function renderAll(){ renderApp(); updateTimerUI(); }

function renderApp(){
  var el=document.getElementById('app'); if(!el) return;
  var today=T();
  var totalMs=todayStudyMs();
  var totalSec=Math.floor(totalMs/1000);
  var studyH=Math.floor(totalSec/3600), studyM=Math.floor((totalSec%3600)/60);

// ===== TODAY'S TODOS =====
function todayTodos(){ return state.todos[T()]||[]; }
function renderTodoList(filterModId){
  var todos=todayTodos();
  if(filterModId) todos=todos.filter(function(t){return t.moduleId===filterModId;});
  var activeTid=state.activeTimer&&state.activeTimer.type==='todo'?state.activeTimer.taskId:null;
  if(todos.length===0) return '<div class="empty">'+(filterModId?'\u8BE5\u6A21\u5757\u4ECA\u65E5\u6682\u65E0\u4EFB\u52A1':'\u4ECA\u65E5\u8FD8\u6CA1\u6709\u4EFB\u52A1\uFF0C\u6DFB\u52A0\u7B2C\u4E00\u4E2A\u5427')+'</div>';
  var html='';
  todos.forEach(function(td){
    var dur=Math.floor(taskMs(td)/60000);
    var timing=td.id===activeTid;
    var modLabel='';
    if(td.moduleId){
      var mod=MODULES.find(function(m){return m.id===td.moduleId;});
      if(mod) modLabel='<span class="todo-mod">'+mod.icon+' '+mod.name+'</span>';
    }
    html+='<div class="todo-row '+(td.done?'done':'')+' '+(timing?'timing':'')+'">';
    html+='<div class="todo-check" onclick="event.stopPropagation();todoToggle(\''+td.id+'\')">'+(td.done?'\u2713':'')+'</div>';
    html+=modLabel;
    html+='<span class="todo-text" onclick="event.stopPropagation();todoToggle(\''+td.id+'\')">'+td.text+'</span>';
    html+='<span class="todo-dur">'+(dur>0?fmtShort(taskMs(td)):'')+'</span>';
    html+=timing?'<button class="todo-btn timing" onclick="event.stopPropagation();todoStopTimer()">\u25A0</button>':'<button class="todo-btn" onclick="event.stopPropagation();todoStartTimer(\''+td.id+'\')" title="'+(td.done?'\u91CD\u65B0\u8BA1\u65F6':'\u5F00\u59CB\u8BA1\u65F6')+'">'+(td.done?'\u21A9':'\u25B6')+'</button>';
    html+='<button class="todo-del" onclick="event.stopPropagation();todoDelete(\''+td.id+'\')">\u2715</button></div>';
  });
  return html;
}

// ===== MODULE TODO TOGGLE =====
function loadModuleTodoData(){
  MODULES.forEach(function(m){
    var el=document.getElementById('mod-todo-'+m.id); if(!el) return;
    var todos=todayTodos().filter(function(t){return t.moduleId===m.id;});
    if(todos.length===0) el.innerHTML='<span>\u4ECA\u65E5\u6682\u65E0\u8BE5\u6A21\u5757\u4EFB\u52A1</span>';
    else el.innerHTML='<div>\u4ECA\u65E5 '+todos.length+'\u9879\u4EFB\u52A1 \u00B7 \u603B\u8BA1\u65F6 \u231B '+fmtDur(moduleTimeToday(m.id))+'</div>';
  });
}
function toggleModuleTodo(modId){
  var el=document.getElementById('mod-todo-'+modId); if(!el) return;
  el.style.display=el.style.display==='none'?'block':'none';
}

// ===== WEEKLY REVIEW =====
function renderWeeklyReview(){
  var weekDays=[];
  for(var i=6;i>=0;i--){ var d=new Date();d.setDate(d.getDate()-i); weekDays.push(d); }
  var allMods=MODULES.filter(function(m){return m.id!=='teaching'||state.teachingActive;});
  var weekData=[];
  var weekTotal=0;
  weekDays.forEach(function(d){
    var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var dayMs=0;
    var dayMods={};
    (state.todos[k]||[]).forEach(function(td){ var ms=taskMs(td); dayMs+=ms; if(td.moduleId){ dayMods[td.moduleId]=(dayMods[td.moduleId]||0)+ms; } });
    weekData.push({date:k,label:dayLabel(6-((6-i))),ms:dayMs,mods:dayMods});
    weekTotal+=dayMs;
  });

  var html='<div class="card"><div class="card-hdr" onclick="toggleCard(this)"><span>\uD83D\uDCCA \u6BCF\u5468\u590D\u76D8</span><span class="arrow">\u25BE</span></div><div class="card-body">';
  html+='<p style="font-size:12px;color:var(--text2);margin-bottom:10px;">\u672C\u5468\u7D2F\u8BA1\u5B66\u4E60 \u231B <b style="color:var(--pri);">'+fmtDur(weekTotal)+'</b> \u00B7 \u6BCF\u65E5\u4EFB\u52A1\u81EA\u52A8\u540C\u6B65</p>';

  html+='<div style="overflow-x:auto;"><table class="wk-table"><thead><tr><th>\u65E5\u671F</th><th>\u5B66\u4E60\u65F6\u957F</th><th>\u6A21\u5757\u5206\u5E03</th></tr></thead><tbody>';
  weekData.forEach(function(wd){
    var modParts=[];
    allMods.forEach(function(m){
      var ms=wd.mods[m.id]||0; if(ms>0) modParts.push(m.icon+' '+fmtDur(ms));
    });
    html+='<tr><td class="wk-day">'+wd.label+'</td><td style="font-weight:600;color:var(--pri);">'+fmtDur(wd.ms)+'</td><td class="wk-cell">'+(modParts.join(' \u00B7 ')||'\u2014')+'</td></tr>';
  });
  html+='</tbody></table></div>';

  html+='<div class="review-field" style="margin-top:12px;"><label>\uD83D\uDCDD \u672C\u5468\u590D\u76D8\u603B\u7ED3</label><textarea id="wk-note" onchange="saveWeekNote()" placeholder="\u672C\u5468\u5B66\u4E60\u603B\u7ED3\u3001\u4E0B\u5468\u8BA1\u5212...">'+(state.weeklyReviewNote||'')+'</textarea></div>';
  html+='</div></div>';
  return html;
}
function saveWeekNote(){ state.weeklyReviewNote=document.getElementById('wk-note')?document.getElementById('wk-note').value:''; saveState(); }

// ===== WEEKLY PIE CHART =====
function renderWeeklyChart(){
  var allMods=MODULES.filter(function(m){return m.id!=='teaching'||state.teachingActive;});
  var modTimes=[];
  var weekTotal=0;
  allMods.forEach(function(m){
    var ms=moduleTimeRange(m.id,7);
    modTimes.push({mod:m,ms:ms});
    weekTotal+=ms;
  });
  var activeMods=modTimes.filter(function(x){return x.ms>0;});
  if(activeMods.length===0){
    return '<div class="card"><div class="card-hdr"><span>\uD83D\uDCC8 \u672C\u5468\u6982\u89C8</span></div><div class="empty">\u672C\u5468\u8FD8\u6CA1\u6709\u5B66\u4E60\u8BB0\u5F55\uFF0C\u5F00\u59CB\u8BA1\u65F6\u540E\u81EA\u52A8\u751F\u6210\u997C\u72B6\u56FE</div></div>';
  }
  var html='<div class="card"><div class="card-hdr"><span>\uD83D\uDCC8 \u672C\u5468\u6982\u89C8 \u00B7 \u6A21\u5757\u65F6\u95F4\u5206\u5E03</span></div>';
  html+='<div class="pie-wrap">';
  html+='<canvas id="pie-canvas" width="200" height="200"></canvas>';
  html+='<div class="pie-legend">';
  activeMods.forEach(function(x){
    var pct=weekTotal>0?Math.round(x.ms/weekTotal*100):0;
    html+='<div class="pie-lg-item"><span class="pie-lg-dot" style="background:'+x.mod.color+';"></span>'+x.mod.icon+' '+x.mod.name+': <b>'+fmtDur(x.ms)+'</b> ('+pct+'%)</div>';
  });
  html+='</div></div></div>';

  setTimeout(function(){ drawPieChart(activeMods); },50);
  return html;
}

function drawPieChart(activeMods){
  var canvas=document.getElementById('pie-canvas'); if(!canvas) return;
  var ctx=canvas.getContext('2d');
  var cx=100, cy=100, r=85;
  ctx.clearRect(0,0,200,200);
  if(activeMods.length===1){
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=activeMods[0].mod.color; ctx.fill();
  } else {
    var total=activeMods.reduce(function(s,x){return s+x.ms;},0);
    var startAngle=-Math.PI/2;
    activeMods.forEach(function(x){
      var sliceAngle=(x.ms/total)*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,startAngle,startAngle+sliceAngle); ctx.closePath();
      ctx.fillStyle=x.mod.color; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
      startAngle+=sliceAngle;
    });
  }
  ctx.beginPath(); ctx.arc(cx,cy,45,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.fillStyle='#1e293b';
  ctx.font='bold 16px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('\u672C\u5468',cx,cy-4);
}

// ===== JOB =====
function renderJobSection(){
  var html='<h3 style="font-size:16px;margin-top:16px;margin-bottom:10px;">\uD83C\uDFAF \u667A\u80FD\u5C97\u4F4D\u63A8\u8350</h3>';
  html+='<div class="job-form"><select id="j-degree"><option value="">\u5B66\u5386</option><option>\u4E13\u79D1\u53CA\u4EE5\u4E0A</option><option>\u672C\u79D1\u53CA\u4EE5\u4E0A</option><option>\u7855\u58EB\u53CA\u4EE5\u4E0A</option></select><select id="j-fresh"><option value="">\u662F\u5426\u5E94\u5C4A</option><option>\u5E94\u5C4A\u53EF\u62A5</option><option>\u4E0D\u9650</option></select><input id="j-major" placeholder="\u4E13\u4E1A\u5173\u952E\u8BCD" style="flex:1;min-width:100px;"><button onclick="filterJobs()">\u7B5B\u9009</button></div>';
  html+='<div class="job-grid" id="job-results"></div>';
  setTimeout(filterJobs,60);
  return html;
}
function filterJobs(){
  var d=document.getElementById('j-degree')?document.getElementById('j-degree').value:'';
  var f=document.getElementById('j-fresh')?document.getElementById('j-fresh').value:'';
  var m=document.getElementById('j-major')?document.getElementById('j-major').value.toLowerCase():'';
  var jobs=sampleJobs.slice();
  if(d) jobs=jobs.filter(function(j){return j.tags.some(function(t){return t.indexOf(d)>=0;});});
  if(f) jobs=jobs.filter(function(j){return j.tags.some(function(t){return t.indexOf(f)>=0;});});
  if(m) jobs=jobs.filter(function(j){return j.tags.some(function(t){return t.toLowerCase().indexOf(m)>=0;});});
  var grid=document.getElementById('job-results'); if(!grid) return;
  if(jobs.length===0){ grid.innerHTML='<p class="empty">\u6CA1\u6709\u5B8C\u5168\u5339\u914D\u7684\u5C97\u4F4D\uFF0C\u8BF7\u653E\u5BBD\u7B5B\u9009\u6761\u4EF6</p>'; return; }
  grid.innerHTML=jobs.map(function(j){return '<div class="job-card"><div class="j-title">'+j.t+'</div><div class="j-info">'+j.info+'</div><div class="j-tags">'+j.tags.map(function(t){return '<span class="j-tag">'+t+'</span>';}).join('')+'</div></div>';}).join('');
}

      interviewHotTopics = HOT_TOPICS_DATA.topics;

      console.log('热点数据加载成功: '+interviewHotTopics.length+' 个话题, 更新日期 '+interviewLastUpdate);

  {t:'庆祝中国共产党成立105周年',cat:'政治',src:'求是杂志/新华社 7月15日',

  {t:'上半年中国经济"稳韧新优"',cat:'经济',src:'国家统计局/人民日报 7月15日',
   article:'7月15日，国家统计局发布2026年上半年经济数据：GDP 695704亿元，同比增长4.7%，运行在"4.5%-5%"目标区间内。高技术制造业增加值增长13.3%，3D打印设备、锂离子电池、工业机器人产量分别增长48.5%、39.3%、28%。夏粮产量3014.9亿斤，首破3000亿斤。城镇调查失业率均值5.2%，CPI温和上涨1.0%，外汇储备稳定在3.4万亿美元以上。IMF上调中国全年增长预期0.2个百分点。新动能对经济增长贡献率超40%，单位GDP能耗下降1.9%。国家统计局副局长用四个字评价：稳、韧、新、优。',
   commentary:'经济类面试题的数据"弹药库"。答题可用"稳、韧、新、优"四字框架：增长底盘稳、抗风险韧性强、新动能加速壮大、经济结构持续优化。关键数据：GDP 4.7%、高技术制造13.3%、夏粮3000亿斤首破、失业率5.2%、CPI 1%。体现"中国经济长期向好的基本面没有改变"的核心论断。'},
  {t:'总书记对基础教育工作作出重要指示',cat:'教育',src:'新华社/央视 7月22日',
   article:'7月22日，全国基础教育工作会议在京召开。习近平总书记作出重要指示强调：要全面贯彻党的教育方针，落实立德树人根本任务，落实健康第一教育理念，坚持五育并举、五育融合，推进基础教育扩优提质，牢牢守住教育公平底线。丁薛祥副总理出席讲话，强调要摒弃"重分数、轻健康"的不良倾向，适应人口变化优化教育资源配置，弘扬教育家精神。会议强调加强中小学生体育、美育、劳动教育和心理健康教育，从"有学上"向"上好学"跨越。',
   commentary:'教育公平是申论和面试经典话题。答题关键词：立德树人根本任务、健康第一理念、教育公平底线、五育并举融合。框架：理念转变（从"分数第一"到"健康第一"）→公平推进（缩小城乡区域差距、扩优提质）→教师队伍（教育家精神、待遇保障）。金句："扣好人生第一粒扣子"；"身上有汗、眼里有光"。'},
  {t:'习近平同巴西总统卢拉通电话',cat:'政治',src:'新华社/学习强国 7月27日',
   article:'7月27日，习近平主席应约同巴西总统卢拉通电话。习近平指出中巴命运共同体建设取得积极进展，强调中国和巴西作为全球南方重要成员，应携手推动"大金砖合作"高质量发展，谱写全球南方团结自强新篇章。卢拉高度赞赏习主席在世界人工智能大会上提出的AI全球治理理念，表示巴中贸易额再创新高，期待加强AI、能源矿产等领域合作。',
   commentary:'大国外交类面试素材。关键词：全球南方、大金砖合作、命运共同体、多边主义。答题时可用"南南合作"框架，结合金砖国家扩员、中巴经贸数据等体现"团结自强"主题。习主席表述："坚定站在历史正确和文明进步一边"。'},
  {t:'新就业形态职业伤害保障试点全国推开',cat:'民生',src:'人社部/人民日报 7月1日',
   article:'7月1日起，新就业形态人员职业伤害保障试点在全国31省份全面推开。采取"按日参保、按单计费、月度缴费、总参总保"方式，个人不缴费，平台企业承担。试点自2022年启动，截至6月底累计参保2990.2万人，覆盖出行、即时配送、同城货运三个行业。新增纳入T3出行、花小猪、美团打车、小象超市、盒马鲜生等平台。被认定为职业伤害的，医疗费、伤残补助金等从工伤保险基金列支，还可享受平台提供的生活保障费。',

  {t:'夏粮首破3000亿斤背后的农业新质生产力',cat:'经济',src:'人民日报/央视 7月10日',
   article:'今年全国夏粮产量3014.9亿斤，首次突破3000亿斤，比上年增长0.7%。值得关注的是，这一成绩是在"困难模式"下取得的——去年黄淮海地区连阴雨导致冬小麦晚播比例高达44.2%，麦收期间又遭遇强降水。主产区推行"以种补晚、以密补晚、以肥补晚、以好补晚、促苗转壮"的"四补一促"稳产路径，环环紧扣从"龙口夺粮"。背后是品种创新与技术集成的双轮驱动——郑麦1860等品种百亩方亩产超840公斤，5G和AI技术实现精准监测，大田生产从"依靠经验"走向"基于数据"。',
   commentary:'粮食安全+农业新质生产力——双热点叠加。答题框架：成绩（3000亿斤首破）→挑战（极端天气、资源约束）→对策（种业振兴、高标准农田、科技赋能）。"中国饭碗端得稳，靠的不是运气，而是不断锤炼穿越风雨的能力"——人民时评原句，答题直接用。'},
  {t:'民营经济促进法典型案例发布',cat:'经济',src:'发改委/最高检 7月22-24日',
   article:'7月22日，国家发改委、最高检联合发布10件贯彻实施民营经济促进法典型案例；7月24日，发改委、最高法又联合发布第一批8件典型案例。案例涵盖职务侵占打击、超范围冻结财产纠正、行政"过罚不当"监督、直播带货合同诈骗惩治、转圈贸易骗局等，体现"法治是最好的营商环境"。典型案例中，一企业因叉车未经检验被罚8万，检察机关认定"过罚不当"后改罚2万；直播带货以"保底销量"为名骗取337家商户保证金2600余万元，主犯获刑超十年。',
   commentary:'营商环境+法治建设经典考题。关键论断："法治是最好的营商环境"；"两个毫不动摇"；民营经济"56789"贡献。具体案例体现三个维度：刑事保护（打击内部腐败和诈骗）、民事监督（纠正超范围查封）、行政监督（过罚相当原则）。答题时用案例说话比空谈政策更有说服力。'},
  {t:'重庆彭水山体崩塌抢险救援',cat:'社会',src:'人民日报/央视 7月17日',
   article:'7月17日9时许，重庆彭水县汉葭街道发生大型山体崩塌，10余栋民房被掩埋。值得关注的是，灾害发生前网格员巡查时发现山体落石和前兆，通过"村村响"广播和居民群发布预警，成功转移1100余名群众，其中核心区60余人提前撤离，有效规避了更大伤亡。救援投入872人、千余台装备，习近平作出重要指示要求全力搜救。会议强调"四个宁可"理念：宁可十防九空不可万一失防、宁可备而不用不可用而无备、宁可听骂声不可听哭声、宁可自己辛苦不可群众受苦。',
   commentary:'应急管理+基层治理的经典案例。答题亮点在"网格员预警"：从一个人发现前兆到千余人安全转移，体现了基层治理"神经末梢"的关键作用。"四个宁可"是体现人民至上理念的绝佳金句。三级包保责任（区县包镇街、镇街包村社、村社包网格）可用在回答基层治理类题目中。'},
  {t:'"十五五"开局之年·新动能挑大梁',cat:'经济',src:'中国青年报/经济日报 7月21日',
   article:'2026年是"十五五"规划开局之年。上半年数据显示新动能"日益挑大梁"：高技术制造业增长13.3%、数字产品制造业增长12.3%、装备制造业增长9.3%，共贡献工业增量近五成。服务业增长5.2%，信息软件技术服务业增长10.7%。外贸表现强劲——进出口总额25.5万亿元，增长16.9%。世界银行在《中国经济简报》中表示中国上半年经济保持韧性。IMF逆势上调中国预期，下调全球预期至3.0%。陕西至安徽特高压工程投运、海洋二号E星发射成功、钙钛矿光伏电池取得突破。',
   commentary:'宏观经济+新质生产力的绝佳素材。可用"全球看中国"的对比视角：IMF下调全球预期却上调中国预期——中国成为动荡局势中的"稳定锚"。三大亮点：制造业高端化、服务业现代化、外贸韧性化。"十五五"开局之年的战略意义可结合规划纲要展开。'},
  {t:'"让技术永远成为人的工具"',cat:'科技',src:'求是网 7月20日',
   article:'求是网发表评论《让技术永远成为人的工具》，提出关键命题：当AI预测能力日益精进，人会否放弃自主判断？当机器生成的文本图像足以以假乱真，真实与虚构如何甄别？文章引用马克思观点——"机器是人的本质力量的对象化，是延伸人的能力、解放人的劳动的工具，不应异化为主宰人的力量"。警示"参数成为描述成长的唯一语言、用户画像取代对他人复杂性的体认"的主体性消解风险。强调技术必须服务于人而非屈从于技术。',
   commentary:'AI伦理与人的主体性——面试中的深度话题。可结合世界人工智能大会上习近平四点意见中的"强化风险意识确保安全可控"。框架：技术价值（赋能千行百业）→伦理风险（算法偏见、深度伪造、就业替代）→治理路径（法律+伦理+技术监测+国际协作）。金句："确保人工智能始终处于人类控制之下"；"技术向善"。'},
  {t:'中泰命运共同体联合声明',cat:'政治',src:'新华社 7月20日',
   article:'7月20日，《中华人民共和国政府和泰王国政府关于面向繁荣中泰命运共同体的联合声明》发布。习近平会见泰国总理阿努廷，强调中国支持泰国新一届政府有效施政。中泰双方在互联互通、数字经济、新能源汽车、旅游人文等领域达成广泛合作共识。泰国总理高度评价习主席在人工智能大会上提出的治理理念。中泰建交50周年系列庆祝活动持续推进。',
   commentary:'周边外交+命运共同体的经典案例。可用于回答"中国特色大国外交""亲诚惠容"等题目。关键词：中泰一家亲、命运共同体、共商共建共享。答题时突出中国"亲诚惠容"周边外交理念。'},
  {t:'国产工业软件与科技自立自强',cat:'科技',src:'人民网/科技日报 7月13日',
   article:'7月13日人民网报道《国产工业软件跑出加速度》：CAD/CAE/EDA等关键工业软件国产替代加速推进；国家超算互联网核心节点上线运行；长征五号遥十四火箭安全运抵文昌航天发射场；"中国智造"成为中国式现代化的亮丽名片。上半年高技术领域投资热度持续攀升，国家重点实验室体系重组加快推进，科技创新举国体制优势进一步显现。',
   commentary:'科技自立自强+新质生产力经典素材。答题框架：为什么要自立（"卡脖子"困境）→怎么做（举国体制+市场机制+人才战略）→具体成果（工业软件、人工智能、航天）。可与"十五五"规划中科技强国建设目标结合。'},

function todoAdd(){

  var text=inp.value.trim(); if(!text) return;

  var moduleId=modSel?modSel.value:'';

function todoToggle(todoId){
  var today=T();var todos=state.todos[today]||[]; var td=todos.find(function(t){return t.id===todoId;}); if(!td) return;
  td.done=!td.done; td.status=td.done?'completed':'pending';
  if(td.done){ td.completedAt=Date.now(); if(state.activeTimer&&state.activeTimer.taskId===todoId&&state.activeTimer.type==='todo'){ stopTimer(true); } }
  updateStreak(); saveState();renderAll();
}
function todoStartTimer(todoId){
  stopTimer(true); var today=T();var todos=state.todos[today]||[]; var td=todos.find(function(t){return t.id===todoId;}); if(!td) return;
  if(td.done) td.done=false; td.status='active';
  state.activeTimer={taskId:todoId,type:'todo',startTime:Date.now(),date:today};
  timerInterval=setInterval(updateTimerUI,1000); saveState();renderAll();
}
function todoStopTimer(){
  var at=state.activeTimer; if(!at||at.type!=='todo') return;
  var todos=state.todos[at.date]||[]; var td=todos.find(function(t){return t.id===at.taskId;});
  if(td){ var end=Date.now(); if(end-at.startTime>1000){td.sessions.push({start:at.startTime,end:end});} if(td.status==='active') td.status='pending'; }
  state.activeTimer=null; if(timerInterval){clearInterval(timerInterval);timerInterval=null;} saveState();renderAll();
}
function todoDelete(todoId){
  if(state.activeTimer&&state.activeTimer.taskId===todoId&&state.activeTimer.type==='todo'){ stopTimer(true); }
  var today=T();var todos=state.todos[today]||[]; var idx=todos.findIndex(function(t){return t.id===todoId;}); if(idx<0) return; todos.splice(idx,1); saveState();renderAll();
}

// ===== TIMER =====
function stopTimer(silent){
  var at=state.activeTimer; if(!at) return;
  if(at.type==='todo'){ todoStopTimer(); }
  if(!silent) renderAll();
}
function completeActiveTimer(){
  var at=state.activeTimer; if(!at) return;
  if(at.type==='todo'){ todoStopTimer(); var todos=state.todos[at.date]||[]; var td=todos.find(function(t){return t.id===at.taskId;}); if(td){td.done=true;td.status='completed';td.completedAt=Date.now();} updateStreak(); saveState();renderAll(); }
}
function updateTimerUI(){
  var bar=document.getElementById('timer-bar'), disp=document.getElementById('t-display'), name=document.getElementById('t-name');
  var at=state.activeTimer; if(!bar||!disp||!name) return;
  if(!at){ bar.classList.remove('show'); return; }
  bar.classList.add('show');
  var taskName='--',sessionMs=0;
  if(at.type==='todo'){ var todos=state.todos[at.date]||[]; var td=todos.find(function(t){return t.id===at.taskId;}); taskName='\u2611 '+(td?td.text:'--'); sessionMs=td?taskMs(td):0; }
  var totalMs=sessionMs+(Date.now()-at.startTime); disp.textContent=fmtHH(Math.floor(totalMs/1000)); name.textContent=taskName;
}

// ===== STREAK =====
function updateStreak(){
  var today=T(); var totalMs=todayStudyMs();
  if(totalMs>0){
    var yest=new Date();yest.setDate(yest.getDate()-1);
    var yk=yest.getFullYear()+'-'+String(yest.getMonth()+1).padStart(2,'0')+'-'+String(yest.getDate()).padStart(2,'0');
    var yTodos=state.todos[yk]||[]; var yMs=0; yTodos.forEach(function(td){yMs+=taskMs(td);});
    state.streak=state.streak||0;
    if(state.lastActiveDate!==today){
      if(state.lastActiveDate===yk&&yMs>0) state.streak++;
      else if(totalMs>0) state.streak=1;
      state.lastActiveDate=today;
    }
    if(state.streak<1) state.streak=1;
  }
}

function init(){ loadState(); state.activeTimer=null; if(timerInterval){clearInterval(timerInterval);timerInterval=null;} fallbackHotTopics(); loadHotTopics(); }
document.addEventListener('DOMContentLoaded',init);

// ===== 数据导出/导入（换设备手动转移） =====
function exportData(){
  try{
    var copy={};
    Object.keys(state).forEach(function(k){copy[k]=state[k];});
    copy.activeTimer=null;
    var json=JSON.stringify(copy,null,2);
    var blob=new Blob([json],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='考公工作台_备份_'+T()+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('\u2705 \u6570\u636E\u5DF2\u5BFC\u51FA\uFF0C\u4FDD\u5B58\u5230\u624B\u673A\u4E0A\u5373\u53EF\u8F6C\u79FB');
  }catch(e){showToast('\u274C \u5BFC\u51FA\u5931\u8D25');}
}
function importData(){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='.json';
  inp.onchange=function(){
    var file=inp.files[0];
    if(!file) return;
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var imported=JSON.parse(e.target.result);
        if(!imported.todos&&!imported.review){showToast('\u274C \u6587\u4EF6\u683C\u5F0F\u4E0D\u6B63\u786E');return;}
        state=Object.assign(defaultState(),imported);
        state.todos=state.todos||{};state.review=state.review||{};
        state.exercise=state.exercise||{};state.diet=state.diet||{};
        state.interview=state.interview||{notes:''};
        state.activeTimer=null;
        saveState();renderAll();
        showToast('\u2705 \u6570\u636E\u5DF2\u5BFC\u5165\uFF01');
      }catch(err){showToast('\u274C \u89E3\u6790\u5931\u8D25\uFF1A'+err.message);}
    };
    reader.readAsText(file);
  };
  inp.click();
}
function showToast(msg){
  var t=document.getElementById('toast');
  if(!t){
    t=document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:9999;background:#1e293b;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:opacity .3s;pointer-events:none;white-space:nowrap;';
    document.body.appendChild(t);
  }
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.style.opacity='0';},2000);
}
</script>
